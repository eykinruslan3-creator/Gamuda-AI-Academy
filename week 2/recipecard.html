<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Favorite Recipe</title>
    <link rel="stylesheet" href="recipestyle.css" />
</head>

<body>

    <div class="recipe-card">
        <div class="recipe-image">
            <img
            src="https://i0.wp.com/khairulaming.my/wp-content/uploads/2024/07/Ayam-Gepuk.webp?fit=720%2C1280&ssl=1"
            alt="Ayam gepuk"
            />
        </div>

        <h1 class="recipe-title">Ayam Gepuk</h1>

        <p class="prep-time">
            Prep Time: 15 minutes | Cook Time: 12 minutes
        </p>

        <h2 class="section-title">Ingredients :</h2>
        <ul class="ingredients-list">
            <li>1 kg ayam</li>
            <li>2 siung bawang putih</li>
            <li>1 sdt garam</li>
            <li>1/2 sdt lada</li>
        </ul>

        <h2 class="section-title">Instructions :</h2>
        <p class="instructions">
            Mix all ingredients together. Blend or pound until well combined, Then add a little hot oil and lime juice.
        </p>

        <p class="difficulty">Difficulty: Medium</p>
    </div>
</body>
</html>
