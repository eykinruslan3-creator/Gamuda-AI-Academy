<!DOCTYPE html>
<html>
<head>
<title>Table Example</title>
</head>
<body>
<h3>Table 1: Table with colspan and rowspan</h3>
<table border="1" width="300">
<tr>
<td align="center" colspan="3">The Best Movies I Watch</td>
</tr>
<tr>
<td align="center" rowspan="3">The Crawdads Sing</td>
<td align="center" colspan="2">Catch me if you can</td>
</tr>
<tr>
</table>
</body>
</html>
